# Hermes profile config for one Sovereign Agents agent. Rendered by
# sa_infra.hermes_profile (smoke) and by the bridge's HermesRuntime (SP2).
# Keys checked against the Hermes version pinned in infra/hermes/VERSION.
model:
  provider: custom
  base_url: "${LLM_BASE_URL}"
  default: "${LLM_MODEL}"
  api_key: local-no-key
agent:
  reasoning_effort: low
  max_turns: 8
  disabled_toolsets: [] # filled from infra/hermes/toolsets.yaml
gateway:
  standalone: true # own process: do not attach to the host multiplexing gateway
  api_server:
    enabled: true
    host: 127.0.0.1
    port: ${API_PORT}
    key: "${API_KEY}"
tools:
  # Bridge MCP tools stay direct, with native structured arguments. With tool search on,
  # Hermes defers every MCP tool behind tool_search/tool_call (no per-tool or per-server
  # opt-out in this version), and tool_call takes the calls as one JSON string that the
  # local model breaks inside long arguments such as an email body. A profile has at
  # most ~12 bridge tools (~1k tokens), so deferral saves nothing here.
  tool_search:
    enabled: "off"
mcp_servers: {} # filled per profile
