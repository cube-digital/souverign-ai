[project]
name = "sa-infra"
version = "0.0.0"
description = "Sovereign Agents dev tooling: model config, guards, Hermes smoke profile, smoke tests"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pyyaml>=6.0",
  "psutil>=6.0",
  "httpx>=0.27",
  "mcp>=1.10",
]

[project.optional-dependencies]
live = [
  "numpy>=1.26",
  "soundfile>=0.12",
  "torch>=2.5",
  "transformers",
  "sentence-transformers>=5.1",
  "mlx-audio",
  "misaki[en]",
  # misaki loads this at runtime and otherwise pip-downloads it; pinned so no smoke path hits the network
  "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "piper-tts>=1.3",
  "pillow", # EmbeddingGemma 2 processors import PIL and torchvision even for text-only use
  "torchvision",
]

[project.scripts]
sa-models = "sa_infra.models_config:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_infra"]

[tool.hatch.metadata]
allow-direct-references = true
